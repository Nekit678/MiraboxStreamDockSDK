name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  property-inspector:
    name: Property Inspector (Node.js 22)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test Property Inspector client and documentation examples
        run: node --test tests/property_inspector.test.js

  performance:
    name: Scheduler performance (Python 3.13.11 on Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SDK
        run: python -m pip install -e .

      - name: Record benchmark environment
        run: |
          mkdir -p build/runtime-scheduler-benchmark
          python - <<'PY' > build/runtime-scheduler-benchmark/environment.json
          import json
          import os
          import platform
          import subprocess
          import sys
          import sysconfig
          from datetime import datetime, timezone
          from pathlib import Path

          import mirabox_sdk

          print(json.dumps({
              "captured_at_utc": datetime.now(timezone.utc).isoformat(),
              "revision": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "sdk_version": mirabox_sdk.__version__,
              "sdk_source": Path(mirabox_sdk.__file__).relative_to(Path.cwd()).as_posix(),
              "python": sys.version,
              "implementation": platform.python_implementation(),
              "platform": platform.platform(),
              "machine": platform.machine(),
              "cpu_count": os.cpu_count(),
              "python_gil_disabled": sysconfig.get_config_var("Py_GIL_DISABLED"),
              "runner": {key: os.environ.get(key) for key in (
                  "RUNNER_OS", "RUNNER_ARCH", "ImageOS", "ImageVersion",
                  "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT",
              )},
          }, indent=2, sort_keys=True))
          PY
          python -m pip list --format=json > build/runtime-scheduler-benchmark/dependencies.json
          lscpu > build/runtime-scheduler-benchmark/cpu.txt

      - name: Check scheduler performance budgets
        run: |
          python scripts/benchmark_runtime_scheduler.py \
            --events 10000 --repeats 3 --callback-delay 0.0001 \
            --workers 4 --pending-limit 64 --coalescing-events 512 \
            --coalescing-pending-limits 1,4,16,64 --check --json \
            > build/runtime-scheduler-benchmark/results.json \
            2> build/runtime-scheduler-benchmark/diagnostics.log

      - name: Upload benchmark results and environment
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-scheduler-benchmark
          path: build/runtime-scheduler-benchmark/
          if-no-files-found: error
          retention-days: 90

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SDK and development tools
        run: python -m pip install -e ".[dev]"

      - name: Check formatting and lint
        run: |
          ruff format --check src tests scripts examples
          ruff check src tests scripts examples

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s examples/counter_plugin/tests -v
        env:
          PYTHONPATH: examples/counter_plugin/src

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts examples

  typecheck:
    name: Static typing (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install SDK and development tools
        run: python -m pip install -e ".[dev]"

      - name: Type check SDK sources and Counter example
        run: python -m mypy

      - name: Build wheel for consumer typing checks
        run: python -m build --wheel

      - name: Type check installed wheel and resolve public annotations
        run: python scripts/verify_wheel_typing.py dist

  package:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: python -m pip install ".[dev]"

      - name: Build wheel and source archive
        run: python -m build

      - name: Verify distribution contents
        run: python scripts/verify_distribution.py dist

      - name: Check package metadata and README rendering
        run: python -m twine check dist/*

      - name: Test installation from wheel
        run: |
          python -m pip uninstall -y mirabox-stream-dock-sdk
          python -m pip install --no-deps dist/*.whl
          python -c "from importlib.metadata import version; import mirabox_sdk; assert mirabox_sdk.__version__ == version('mirabox-stream-dock-sdk')"
          mirabox-sdk copy-property-inspector build/property-inspector
          python -m unittest tests.test_public_api tests.test_testing tests.test_plugin_validation -v

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
